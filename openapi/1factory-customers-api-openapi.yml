openapi: 3.2.0
info:
  title: 1Factory Customers API
  description: This API allows you to create and query a number of objects in your 1Factory account.
  version: '24.31'
  termsOfService: https://www.1factory.com/resources/TOS%20May%2020%202021.pdf
  contact:
    name: API Support
    url: https://1factoryhelp.zendesk.com/hc/en-us
    email: support@1factory.com
servers:
- url: https://www.1factory.co/api/v1
  description: Sandbox server
- url: https://www.1factory.com/api/v1
  description: Production server
- url: https://val.1factory.co/api/v1
  description: Validated Sandbox server
- url: https://val.1factory.com/api/v1
  description: Validated Production server
- url: https://localhost/api/v1
  description: Local development
security:
- OrgId: []
  ApiKey: []
tags:
- name: Customers
  description: Data shared with your organization by your customers.
paths:
  /cus/plans:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a List of Plans Shared with Your Organization by Your Customers
      description: 'The list of customer plans can be filtered by specifying query parameters.


        Paging parameters control the number of rows Plan objects returned. By default, the first 100 plans are returned.'
      parameters:
      - $ref: '#/components/parameters/page'
        example: example-value
      - $ref: '#/components/parameters/pageSize'
        example: example-value
      - $ref: '#/components/parameters/part_number'
        example: example-value
      - $ref: '#/components/parameters/rev'
        example: example-value
      - $ref: '#/components/parameters/status'
        example: example-value
      - $ref: '#/components/parameters/approval_status'
        example: example-value
      - $ref: '#/components/parameters/customer'
        example: example-value
      - $ref: '#/components/parameters/is_tabulated'
        example: example-value
      - $ref: '#/components/parameters/createdAfter'
        example: example-value
      - $ref: '#/components/parameters/createdBefore'
        example: example-value
      - $ref: '#/components/parameters/updatedAfter'
        example: example-value
      - $ref: '#/components/parameters/updatedBefore'
        example: example-value
      - $ref: '#/components/parameters/closedAfter'
        example: example-value
      - $ref: '#/components/parameters/closedBefore'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
              examples:
                Getcusplans200Example:
                  summary: Default getcusplans 200 response
                  x-microcks-default: true
                  value:
                  - ID: 42
                    part_number: example-value
                    rev: example-value
                    part_description: example-value
                    operation: example-value
                    project_identifier: example-value
                    status: Inactive
                    version: 3.14
                    version_status: Released
                    approval_status: Assigned
                    customer_name: example-value
                    supplier_name: example-value
                    supplier_number: example-value
                    is_tabulated: true
                    is_spec_lib: true
                    created_by_name: example-value
                    created_on: '2025-03-15T14:30:00Z'
                    updated_on: '2025-03-15T14:30:00Z'
          description: Returns a list of plans, most recently updated first. Utilize paging query parameters to query older plans. By default the 100 most recent are returned.
        '400':
          $ref: '#/components/responses/InvalidQueryParam'
        '401':
          $ref: '#/components/responses/401'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusPlans
      x-operation-id-source: derived
  /cus/plans/{plan_id}:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a Detailed Customer Plan Record
      description: Returns the specified plan record, including specifications.
      parameters:
      - $ref: '#/components/parameters/planID'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
              examples:
                GetcusplansplanId200Example:
                  summary: Default getcusplansplan_id 200 response
                  x-microcks-default: true
                  value:
                    ID: 42
                    part_number: example-value
                    rev: example-value
                    part_description: example-value
                    operation: example-value
                    project_identifier: example-value
                    status: Inactive
                    version: 3.14
                    version_status: Released
                    approval_status: Approved
                    customer_name: example-value
                    supplier_name: example-value
                    supplier_number: example-value
                    is_tabulated: true
                    is_spec_lib: true
                    created_by_name: example-value
                    created_on: '2025-03-15T14:30:00Z'
                    updated_on: '2025-03-15T14:30:00Z'
                    specifications:
                    - example-value
          description: Returns a detailed plan record, including specification data.
        '400':
          $ref: '#/components/responses/InvalidPathParam'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Plan does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FAC-20
                message: 'Not found: Customer Plan ''12345'' does not exist.'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusPlansByPlanId
      x-operation-id-source: derived
  /cus/inspections:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a List of Inspections Shared with Your Organization by Your…
      description: 'The list of customer inspections can be filtered by specifying query parameters.


        Paging parameters control the number of rows Inspection objects returned. By default, the first 100 inspections are returned.'
      parameters:
      - $ref: '#/components/parameters/page'
        example: example-value
      - $ref: '#/components/parameters/pageSize'
        example: example-value
      - $ref: '#/components/parameters/part_number'
        example: example-value
      - $ref: '#/components/parameters/rev'
        example: example-value
      - $ref: '#/components/parameters/inspIdent1'
        example: example-value
      - $ref: '#/components/parameters/inspIdent2'
        example: example-value
      - $ref: '#/components/parameters/customer'
        example: example-value
      - $ref: '#/components/parameters/inspectionStatus'
        example: example-value
      - $ref: '#/components/parameters/closedAfter'
        example: example-value
      - $ref: '#/components/parameters/reviewStatus'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionList'
              examples:
                Getcusinspections200Example:
                  summary: Default getcusinspections 200 response
                  x-microcks-default: true
                  value:
                  - ID: 42
                    insp_ident_1: example-value
                    insp_ident_2: example-value
                    insp_ident_3: example-value
                    part_number: example-value
                    rev: example-value
                    part_description: example-value
                    operation: example-value
                    customer_name: example-value
                    supplier_name: example-value
                    supplier_number: example-value
                    project_identifier: example-value
                    site: example-value
                    created_by_name: example-value
                    created_on: '2025-03-15T14:30:00Z'
                    in_spec_pct: 3.14
                    inspection_status: Rejected
                    inspected_by_name: example-value
                    inspected_on: '2025-03-15T14:30:00Z'
                    review_status: Reviewed
                    reviewed_by_name: example-value
                    reviewed_on: '2025-03-15T14:30:00Z'
                    notes: example-value
                    ncrs:
                    - example-value
                    updated_on: '2025-03-15T14:30:00Z'
                    closed_on: '2025-03-15T14:30:00Z'
                    inspection_type: example-value
                    machines:
                    - example-value
                    lot_size: 42
                    parts_passed: 3.14
                    parts_failed: 3.14
          description: Returns a list of inspections, most recently updated first. Utilize paging query parameters to query older inspections. By default the 100 most recent are returned.
        '400':
          $ref: '#/components/responses/InvalidQueryParam'
        '401':
          $ref: '#/components/responses/401'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusInspections
      x-operation-id-source: derived
  /cus/inspections/{inspection_id}:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a Detailed Customer Inspection Record
      description: Returns the specified inspection record, including measurement data.
      parameters:
      - $ref: '#/components/parameters/inspectionID'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionDetail'
              examples:
                GetcusinspectionsinspectionId200Example:
                  summary: Default getcusinspectionsinspection_id 200 response
                  x-microcks-default: true
                  value: {}
          description: Returns a detailed inspection record, including measurement data.
        '400':
          $ref: '#/components/responses/InvalidPathParam'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Inspection does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FAC-20
                message: 'Not found: Customer Inspection ''12345'' does not exist.'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusInspectionsByInspectionId
      x-operation-id-source: derived
  /cus/fais:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a List of First-article Inspections Shared with Your Organization…
      description: 'The list of customer first-article inspections can be filtered by specifying query parameters.


        Paging parameters control the number of rows Inspection objects returned. By default, the first 100 inspections are returned.'
      parameters:
      - $ref: '#/components/parameters/page'
        example: example-value
      - $ref: '#/components/parameters/pageSize'
        example: example-value
      - $ref: '#/components/parameters/part_number'
        example: example-value
      - $ref: '#/components/parameters/rev'
        example: example-value
      - $ref: '#/components/parameters/inspIdent1'
        example: example-value
      - $ref: '#/components/parameters/inspIdent2'
        example: example-value
      - $ref: '#/components/parameters/customer'
        example: example-value
      - $ref: '#/components/parameters/faiType'
        example: example-value
      - $ref: '#/components/parameters/inspectionStatus'
        example: example-value
      - $ref: '#/components/parameters/closedAfter'
        example: example-value
      - $ref: '#/components/parameters/reviewStatus'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaiList'
              examples:
                Getcusfais200Example:
                  summary: Default getcusfais 200 response
                  x-microcks-default: true
                  value:
                  - ID: 42
                    insp_ident_1: example-value
                    insp_ident_2: example-value
                    insp_ident_3: example-value
                    part_number: example-value
                    rev: example-value
                    part_description: example-value
                    operation: example-value
                    customer_name: example-value
                    supplier_name: example-value
                    supplier_number: example-value
                    project_identifier: example-value
                    site: example-value
                    created_by_name: example-value
                    created_on: '2025-03-15T14:30:00Z'
                    in_spec_pct: 3.14
                    inspection_status: Pending
                    inspected_by_name: example-value
                    inspected_on: '2025-03-15T14:30:00Z'
                    review_status: Pending
                    reviewed_by_name: example-value
                    reviewed_on: '2025-03-15T14:30:00Z'
                    notes: example-value
                    ncrs:
                    - example-value
                    updated_on: '2025-03-15T14:30:00Z'
                    closed_on: '2025-03-15T14:30:00Z'
                    fai_type: Standard
                    number_of_parts: 42
          description: Returns a list of first-article inspections, most recently updated first. Utilize paging query parameters to query older inspections. By default the 100 most recent are returned.
        '400':
          $ref: '#/components/responses/InvalidQueryParam'
        '401':
          $ref: '#/components/responses/401'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusFais
      x-operation-id-source: derived
  /cus/fais/{inspection_id}:
    get:
      tags:
      - Customers
      summary: 1Factory Gets a Detailed Customer First-article Inspection Record
      description: Returns the specified first-article inspection record, including measurement data.
      parameters:
      - $ref: '#/components/parameters/inspectionID'
        example: example-value
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaiDetail'
              examples:
                GetcusfaisinspectionId200Example:
                  summary: Default getcusfaisinspection_id 200 response
                  x-microcks-default: true
                  value: {}
          description: Returns a detailed first-article inspection record, including measurement data.
        '400':
          $ref: '#/components/responses/InvalidPathParam'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Inspection does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FAC-20
                message: 'Not found: Customer FAI ''12345'' does not exist.'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getCusFaisByInspectionId
      x-operation-id-source: derived
components:
  schemas:
    SpecInspectionType:
      type: object
      properties:
        inspection_type:
          $ref: '#/components/schemas/inspection_type'
        inspection_method:
          type:
          - string
          - 'null'
          description: How the feature should be inspected.
          example: CMM
        sampling_rule:
          type:
          - string
          - 'null'
          description: How frequently should the feature be checked.
          example: 1 in 10
        data_type:
          type: string
          enum:
          - NUM
          - P/F
          - CALC
          description: How the data for this specification is recorded - numerically, as a pass/fail, or calculated from other features.
          example: NUM
    insp_ident_1:
      type: string
      minLength: 1
      maxLength: 255
      description: Primary identifier for an inspection or FAI, for example a Work Order or Purchase Order. For FAIs, this is the 'FAI Number'. Must be unique for each entry when used in a Work Order List.
      example: PO-12345
    PartData:
      type: object
      description: Inspection data for a single part.
      properties:
        grp_ident:
          type:
          - string
          - 'null'
          description: Identifier for a grouping of parts.
          example: CAVITY1
        row_ident:
          type:
          - string
          - 'null'
          description: Identifier for a unique part, sucha as a serial number.
          example: SN100001
        updated_on:
          type: string
          description: Date & time that data for this part was last updated.
          example: '2021-07-16T17:53:41-08:00'
        measurements:
          type: array
          minimum: 1
          description: List of measurements recorded for part. Order of entries corresponds to order of specifications, so index of a measurement corresponds to the index of the feature specification & place it is for.
          items:
            type:
            - object
            - 'null'
            properties:
              value:
                type: number
                description: Actual measurement recorded. For a pass/fail specification, 1.0 corresponds to PASS, 0.0 corresponds to FAIL.
                example: 1.1234
              bonus:
                type:
                - number
                - 'null'
                description: For GD&T specs that allow a bonus tolerance, the bonus tolerance to apply to actual measurement.
                example: 0.02
    Fai:
      type: object
      properties:
        ID:
          $ref: '#/components/schemas/ID'
        insp_ident_1:
          $ref: '#/components/schemas/insp_ident_1'
        insp_ident_2:
          $ref: '#/components/schemas/insp_ident_2'
        insp_ident_3:
          $ref: '#/components/schemas/insp_ident_3'
        part_number:
          $ref: '#/components/schemas/part_number'
        rev:
          $ref: '#/components/schemas/rev'
        part_description:
          $ref: '#/components/schemas/part_description'
        operation:
          $ref: '#/components/schemas/operation'
        customer_name:
          $ref: '#/components/schemas/customer_name'
        supplier_name:
          $ref: '#/components/schemas/supplier_name'
        supplier_number:
          $ref: '#/components/schemas/supplier_number'
        project_identifier:
          $ref: '#/components/schemas/project_identifier'
        site:
          type:
          - string
          - 'null'
          description: Location where inspection was performed, from your organization's Site LOV.
          example: QC Lab
        created_by_name:
          $ref: '#/components/schemas/created_by_username'
        created_on:
          $ref: '#/components/schemas/created_on'
        in_spec_pct:
          type: number
          format: double
          description: Percentage of in-spec parts for this inspection.
          readOnly: false
          minimum: 0.0
          maximum: 100.0
          example: 100.0
        inspection_status:
          type: string
          enum:
          - Pending
          - Accepted
          - Rejected
          description: Current status of inspection.
          default: Accepted
        inspected_by_name:
          type:
          - string
          - 'null'
          description: Name of user that last set inspection status.
          example: Will Stallard
        inspected_on:
          type:
          - string
          - 'null'
          format: date-time
          description: Date & time that inspection status set.
          example: '2021-07-16T17:42:31-08:00'
        review_status:
          type: string
          enum:
          - Pending
          - Reviewed
          description: Current review status of inspection.
          default: Pending
        reviewed_by_name:
          type:
          - string
          - 'null'
          description: Name of user that set review status.
          example: Nipun Girotra
        reviewed_on:
          type:
          - string
          - 'null'
          format: date-time
          description: Date & time that review status was set.
          example: '2021-07-16T17:53:41-08:00'
        notes:
          type:
          - string
          - 'null'
          maxLength: 32000
          description: Comments on this inspection
          example: Parts are discolored.
        ncrs:
          type: array
          minItems: 0
          items:
            type: string
          description: 'List of NCR #s associated with this inspection'
          example:
          - NCR-123
          - NCR-456
        updated_on:
          $ref: '#/components/schemas/updated_on'
        closed_on:
          $ref: '#/components/schemas/closed_on'
        fai_type:
          $ref: '#/components/schemas/fai_type'
        number_of_parts:
          $ref: '#/components/schemas/number_of_parts'
    Specification:
      type: object
      description: Specification that defines feature to be measured.
      properties:
        bln_no:
          type: string
          description: Balloon number for feature.
          example: '1'
        sheet_zone:
          type: string
          description: Sheet and zone of the specification
          example: '1 : B1'
        place:
          type: integer
          minimum: 1
          description: Place number - for features that have multiple places, feature specification is repeated for each place.
          example: 1
        characteristic:
          type: string
          description: Characteristic being measured, or, in the case of a note, the text of the note.
          example: True position
        characteristic_type:
          type: string
          enum:
          - Nom ± Tol
          - GD&T
          - Basic
          - Min - Max
          - Note
          - Nom++Tol
          - Nom -- Tol
          - Reference
          description: Type of characteristic being measured.
          example: GD&T
        dimension_type:
          type: string
          enum:
          - STD
          - MFG
          - DVN
          description: Dimension type for this specification - Standard, Manufacturing or Deviation.
          example: STD
        referenced_feature:
          type:
          - string
          - 'null'
          description: Balloon number of specification that this feature references, for example a manufacturing dimension referencing the actual drawing dimension it corresponds to.
          example: '1'
        data_type:
          type: string
          enum:
          - NUM
          - P/F
          - CALC
          description: How the data for this specification is recorded - numerically, as a pass/fail, or calculated from other features.
          example: NUM
        nominal:
          type:
          - number
          - 'null'
          description: Nominal value for this specification.
          example: 1.12
        lower_spec_limit:
          type:
          - number
          - 'null'
          description: Lower specification limit for the feature.
          example: 1.11
        upper_spec_limit:
          type:
          - number
          - 'null'
          description: Upper specification limit for the feature.
          example: 1.14
        unit:
          type:
          - string
          - 'null'
          description: Unit of measure for this feature.
          example: mm
        descriptor_datum:
          type:
          - string
          - 'null'
          description: Descriptor of feature. For GD&T, this is used to record the datum.
          example: A
        bonus_tolerance:
          type:
          - string
          - 'null'
          enum:
          - MMC
          - LMC
          description: For GD&T features, defines the material condition for evaluating bonus tolerance, if applicable.
          example: MMC
        label:
          type:
          - string
          - 'null'
          description: Optional label to add more information to the specification.
          example: COUNTERSINK
        inspection_method:
          type:
          - string
          - 'null'
          description: How the feature should be inspected.
          example: CMM
        sampling_rule:
          type:
          - string
          - 'null'
          description: How frequently should the feature be checked.
          example: 1 in 10
        operation:
          type:
          - string
          - 'null'
          description: Manufacturing operation for the feature.
          example: OP10
        is_key:
          type: boolean
          description: Indicates if feature is key for quality.
          example: true
    Error:
      properties:
        code:
          type: string
          description: Error code identifying type of error.
        message:
          type: string
          description: Error message.
    operation:
      type:
      - string
      - 'null'
      description: Operation of the inspection. No operation specified or an operation of 'All' indicates that an inspection is for all operations in the inspection Plan. (Only for manufacturing inspections, and if the 'Inspections by Op' configuration is enabled for your organization.)
      example: OP 10
    updated_on:
      type: string
      format: date-time
      description: Date & time that an object was last updated.
      example: '2021-07-17T12:14:42-08:00'
    number_of_parts:
      type: integer
      format: int32
      minimum: 1
      description: Number of parts inspected.
      example: 3
    supplier_name:
      type:
      - string
      - 'null'
      description: The name of the supplier (for receiving or supplier inspections).
      example: Acme Industries
    insp_ident_3:
      type:
      - string
      - 'null'
      minLength: 0
      maxLength: 255
      description: 'Tertiary identifier for an inspection, for example a Customer Purchase Order or Lot #. (Optional)'
      example: 1A
    lot_size:
      type:
      - integer
      - 'null'
      format: int32
      minimum: 0
      description: Number of parts in lot being inspected
      example: 100
    created_on:
      type: string
      format: date-time
      description: Date & time that an object was created.
      example: '2021-07-15T09:14:42-08:00'
    project_identifier:
      name: project_identifier
      in: query
      required: false
      schema:
        type:
        - string
        - 'null'
        example: Bearings
      description: "Name of project_identifier to filter on. Must come from your organization's Part Master Project Identifier LOV. \n\n(The name used in the UI for this LOV is configured in your organization's Part Master settings and might not be 'Project Identifier')."
    customer_name:
      type:
      - string
      - 'null'
      description: The name of the customer (for manufacturing inspections).
      example: Rocket Company
    machines:
      type: array
      description: List of machines for the inspection. Only for manufacturing inspections. Entries in this list must match the Mfg. Resources - Machines LOV configured for your organization.
      items:
        type: string
        minItems: 0
    fai_type:
      type: string
      description: Type of first-article inspection.
      enum:
      - Standard
      - AS9102
      example: Standard
    ID:
      type: integer
      format: int32
      description: Unique identifier for the Inspection, assigned by 1Factory.
      readOnly: true
      example: 12345
    Inspection:
      type: object
      properties:
        ID:
          $ref: '#/components/schemas/ID'
        insp_ident_1:
          $ref: '#/components/schemas/insp_ident_1'
        insp_ident_2:
          $ref: '#/components/schemas/insp_ident_2'
        insp_ident_3:
          $ref: '#/components/schemas/insp_ident_3'
        part_number:
          $ref: '#/components/schemas/part_number'
        rev:
          $ref: '#/components/schemas/rev'
        part_description:
          $ref: '#/components/schemas/part_description'
        operation:
          $ref: '#/components/schemas/operation'
        customer_name:
          $ref: '#/components/schemas/customer_name'
        supplier_name:
          $ref: '#/components/schemas/supplier_name'
        supplier_number:
          $ref: '#/components/schemas/supplier_number'
        project_identifier:
          $ref: '#/components/schemas/project_identifier'
        site:
          type:
          - string
          - 'null'
